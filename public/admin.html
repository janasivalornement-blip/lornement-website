<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Owner | L'Ornement</title><link rel="stylesheet" href="/admin.css"/></head><body><main class="admin-shell"><a class="back" href="/">← Storefront</a><div id="loginView" class="login-card"><div class="mark">L</div><p class="eyebrow">L'ORNEMENT OWNER SPACE</p><h1>Welcome back.</h1><p>Manage your edit and keep the catalogue fresh.</p><form id="loginForm"><label>Password<input id="password" type="password" required placeholder="Enter owner password"/></label><button>Unlock dashboard</button><p class="error" id="loginError"></p></form></div><div id="dashboard" hidden><div class="admin-head"><div><p class="eyebrow">OWNER DASHBOARD</p><h1>Your catalogue</h1></div><button class="outline" id="logout">Log out</button></div><div class="admin-grid"><section class="panel"><div class="panel-head"><div><p class="eyebrow">NEW PIECE</p><h2>Add a product</h2></div></div><form id="productForm"><label>Product name<input name="name" required placeholder="e.g. Pearl Drop Earrings"/></label><div class="two-col"><label>Category<select name="category" id="categorySelect"></select></label><label>Price (₹)<input name="price" type="number" min="1" required placeholder="850"/></label></div><label>Description<textarea name="description" rows="3" placeholder="A short note about the piece"></textarea></label><label>Image URLs <span class="hint">one per line</span><textarea name="imageUrls" rows="3" placeholder="https://..."></textarea></label><label>Or upload images <input id="imageFiles" type="file" accept="image/*" multiple /></label><div class="upload-preview" id="uploadPreview"></div><button class="solid">Add product</button><p class="form-message" id="productMessage"></p></form></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">LIVE CATALOGUE</p><h2>Products</h2></div><span id="productCount"></span></div><div id="adminProducts" class="admin-products"></div></section><section class="panel categories-panel"><div class="panel-head"><div><p class="eyebrow">ORGANISE</p><h2>Categories</h2></div></div><form id="categoryForm" class="category-form"><input name="name" required placeholder="New category"/><button class="solid">Add</button></form><div id="adminCategories"></div></section></div></div></main><script src="/admin.js" defer></script></body></html>
